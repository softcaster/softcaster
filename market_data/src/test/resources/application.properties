# Configurazione Spring - Disattiva Tomcat sulla 8080
spring.main.web-application-type=NONE

# Configurazione gRPC - Disattiva la porta 9090
spring.grpc.server.port=-1

# Configurazione Database PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sofie
spring.datasource.username=sofie
spring.datasource.password=sofie
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurazione JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Configurazione Logging
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
